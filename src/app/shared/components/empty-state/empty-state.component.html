<div class="empty-state">
  <i class="bi empty-state__icon" [ngClass]="iconClass"></i>
  @if (title) {
    <h5 class="empty-state__title">{{ title }}</h5>
  }
  @if (message) {
    <p class="empty-state__message">{{ message }}</p>
  }
  @if (actionLabel && actionLink) {
    <a [routerLink]="actionLink" class="lux-link empty-state__action">{{ actionLabel }}</a>
  }
</div>
