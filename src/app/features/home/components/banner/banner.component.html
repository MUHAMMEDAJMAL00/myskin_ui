<section class="hero">
  <video
    #heroVideo
    class="hero__video"
    muted loop playsinline preload="auto"
  >
    <source src="assets/bold/new.mp4" type="video/mp4" />
  </video>
  <div class="hero__veil"></div>

  <div class="hero__content">
    @for (slide of slides; track slide; let i = $index) {
      <div
        class="hero__slide"
        [class.hero__slide--current]="i === currentIndex"
        [class.hero__slide--prev]="i === (currentIndex - 1 + slides.length) % slides.length"
        [class.hero__slide--next]="i === (currentIndex + 1) % slides.length"
      >
        <span class="hero__label">{{ slide.label }}</span>
        <h1 class="hero__title">
          {{ slide.title }}<br />
          <em>{{ slide.titleEm }}</em>
        </h1>
        <p class="hero__sub">{{ slide.sub }}</p>
        <div class="hero__actions">
          <button type="button" class="hero__cta" (click)="scrollToCollections()">
            {{ slide.ctaLabel }}
          </button>
          <a routerLink="/about" class="hero__cta hero__cta--ghost">{{ slide.ghostLabel }}</a>
        </div>
      </div>
    }
  </div>


  <div class="hero__foot">
    <div class="hero__feature">
      <i class="bi bi-droplet"></i>
      <span>Water Efficient</span>
    </div>
    <div class="hero__feature">
      <i class="bi bi-patch-check"></i>
      <span>Patented Design</span>
    </div>
    <div class="hero__feature">
      <i class="bi bi-geo-alt"></i>
      <span>Designed in Dubai</span>
    </div>
  </div>

</section>
